name: Android Field 2
on:
  push:
    paths: ['android/**', 'schemas/**', 'integration/**', 'tests/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'schemas/**', 'integration/**', 'tests/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintDebug
        working-directory: android
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integration/requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: field2-debug-apk-and-tests
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
