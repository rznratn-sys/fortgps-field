<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FortGPS Field</title><style>body{font:18px system-ui;background:#101d19;color:#f0f5ed;margin:0;padding:16px}main{max-width:600px;margin:auto}section{border:1px solid #45665a;background:#20352e;border-radius:20px;margin:20px 0;padding:20px}button{font:inherit;font-weight:bold;background:#b7df7c;color:#122515;border:0;border-radius:14px;padding:18px;margin:5px 0}#locate,#save{width:100%;font-size:23px}label{display:block;margin:14px 0}textarea{width:95%;min-height:60px}small,p{line-height:1.5;color:#c6d2ca}.exports{display:flex;gap:10px;flex-wrap:wrap}.exports button{flex:1;background:#355649;color:white}</style><main><h1>🧭 FortGPS Field</h1><p>Terénní pozorování, nikoli potvrzené polohy objektů. Záznamy jsou pouze v tomto zařízení až do exportu.</p><section><button id="locate">◎ ZAMĚŘIT BOD</button><p id="status">Zaměř polohu na místě pozorování.</p><div id="form" hidden><p id="position"></p><label><input type="radio" name="type" value="jednoduchy_bunkr" checked> Jednoduchý bunkr</label><label><input type="radio" name="type" value="velky_bunkr"> Velký bunkr</label><label><input type="radio" name="type" value="vstup_do_podzemi"> Vstup do podzemí</label><label>Poznámka<textarea id="note"></textarea></label><button id="save">ULOŽIT ZÁZNAM</button></div></section><section><h2>Záznamy: <span id="count">0</span></h2><div class="exports"><button id="csv">CSV export</button><button id="geo">GeoJSON</button><button id="share">Sdílet CSV</button><button id="backup">Záloha JSON</button></div></section><p><small>WGS84 / EPSG:4326. Udávaná přesnost GPS není zárukou skutečné přesnosti. Exportuj pravidelně.</small></p></main><script>
let data=[];try{data=JSON.parse(localStorage.getItem('fortgps_field_v1')||'[]');if(!Array.isArray(data))data=[]}catch(e){}let fix=null;const g=x=>document.getElementById(x),status=t=>g('status').textContent=t;
function count(){g('count').textContent=data.length}count();
g('locate').onclick=()=>{if(!isSecureContext)return status('GPS vyžaduje zabezpečenou HTTPS stránku.');if(!navigator.geolocation)return status('Prohlížeč nepodporuje GPS.');g('locate').disabled=true;g('form').hidden=true;status('Zjišťuji polohu…');navigator.geolocation.getCurrentPosition(p=>{fix={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy_m:p.coords.accuracy,position_time:new Date(p.timestamp).toISOString()};g('position').textContent=fix.latitude.toFixed(6)+', '+fix.longitude.toFixed(6)+' ±'+Math.round(fix.accuracy_m)+' m';g('form').hidden=false;g('locate').disabled=false;status('Poloha zaměřena. Vyber typ a ulož.');},e=>{g('locate').disabled=false;status('GPS chyba: '+(e.code===1?'přístup zamítnut':e.code===2?'poloha nedostupná':'časový limit'));},{enableHighAccuracy:true,maximumAge:0,timeout:30000})};
g('save').onclick=()=>{if(!fix)return;let r={id:crypto.randomUUID(),recorded_at:new Date().toISOString(),...fix,type:document.querySelector('input[name=type]:checked').value,note:g('note').value,source:'FortGPS Field',verification_status:'unverified',position_role:'observer_device'};let next=[...data,r];try{localStorage.setItem('fortgps_field_v1',JSON.stringify(next))}catch(e){return status('Uložení selhalo!')}data=next;fix=null;g('form').hidden=true;g('note').value='';count();status('Záznam uložen. Nezapomeň exportovat.')};
const cols=['id','recorded_at','position_time','latitude','longitude','accuracy_m','type','note','source','verification_status','position_role'];
function csv(){return '\uFEFF'+cols.join(';')+'\r\n'+data.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')+'\r\n'}
function geo(){return JSON.stringify({type:'FeatureCollection',features:data.map(r=>({type:'Feature',geometry:{type:'Point',coordinates:[r.longitude,r.latitude]},properties:Object.fromEntries(Object.entries(r).filter(([k])=>!['longitude','latitude'].includes(k)))}))},null,2)}
function download(content,ext,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:mime}));a.href=u;a.download='FortGPS_Field_'+new Date().toISOString().slice(0,10)+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function ready(){if(!data.length){status('Žádné záznamy k exportu.');return false}return true}
g('csv').onclick=()=>{if(ready())download(csv(),'csv','text/csv;charset=utf-8')};
g('geo').onclick=()=>{if(ready())download(geo(),'geojson','application/geo+json')};
g('backup').onclick=()=>download(JSON.stringify({format:'FortGPS Field v1',records:data},null,2),'json','application/json');
g('share').onclick=async()=>{if(!ready())return;let f=new File([csv()],'FortGPS_Field.csv',{type:'text/csv'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'FortGPS Field'});else download(csv(),'csv','text/csv;charset=utf-8')}catch(e){if(e.name!=='AbortError')status('Sdílení se nepovedlo')}};</script></html>
